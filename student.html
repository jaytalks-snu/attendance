<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Attendance Check-In</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0ede8;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.2);
    --text: #1a1917; --text-muted: #6b6a67; --text-faint: #9e9d9a;
    --green: #2d7d4f; --green-bg: #e8f5ee; --green-border: #a3d4b5;
    --red: #c0392b; --red-bg: #fdecea; --red-border: #f0b0aa;
    --amber: #8a5a00; --amber-bg: #fdf4e0; --amber-border: #f0d080;
    --blue: #1a5fa8; --blue-bg: #e8f0fb; --blue-border: #a3c0f0;
    --radius: 10px; --radius-lg: 16px;
  }
  body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; }
  .header-top { display: flex; align-items: center; gap: 12px; }
  .logo { width: 30px; height: 30px; background: var(--text); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 2; }
  .header-top h1 { font-size: 15px; font-weight: normal; flex: 1; }
  .header-tag { font-family: monospace; font-size: 11px; background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); padding: 2px 8px; border-radius: 99px; }

  /* Course info banner */
  .course-banner { margin-top: 10px; padding: 10px 12px; background: var(--blue-bg); border: 1px solid var(--blue-border); border-radius: var(--radius); display: none; }
  .course-title { font-size: 14px; color: var(--blue); font-weight: normal; }
  .course-meta { font-family: monospace; font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  main { flex: 1; padding: 16px 20px; max-width: 420px; margin: 0 auto; width: 100%; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px; }
  .section-label { font-family: monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--text-faint); text-transform: uppercase; margin-bottom: 10px; }

  /* Name */
  input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); font-size: 15px; background: var(--surface); color: var(--text); font-family: 'Georgia', serif; }
  input[type=text]:focus { outline: none; border-color: var(--text); }
  .name-display { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--green-bg); border: 1px solid var(--green-border); border-radius: var(--radius); }
  .name-display .name-text { font-size: 15px; color: var(--green); }
  .name-display .name-edit { font-family: monospace; font-size: 11px; color: var(--text-muted); cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; }
  .name-display .name-edit:hover { color: var(--text); }

  /* Camera */
  #reader-container { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: #111; position: relative; display: none; margin-bottom: 12px; }
  #reader { width: 100% !important; }
  #reader video { width: 100% !important; border-radius: 0 !important; }
  #reader img { display: none !important; }
  #reader > div { border: none !important; box-shadow: none !important; }
  .scan-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .scan-frame { width: 200px; height: 200px; border: 2px solid rgba(255,255,255,0.7); border-radius: 14px; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.4;}50%{opacity:0.9;} }

  .camera-status { font-family: monospace; font-size: 12px; color: var(--text-muted); text-align: center; padding: 6px 0 10px; }
  .btn-row { display: flex; gap: 8px; justify-content: center; }
  .btn { padding: 10px 20px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 14px; font-family: 'Georgia', serif; cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: var(--surface2); }
  .btn-primary { background: var(--text); color: white; border-color: var(--text); }
  .btn-primary:hover { opacity: 0.85; }
  .btn-full { width: 100%; }

  /* Result */
  .result-box { padding: 14px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; display: none; margin-top: 12px; }
  .result-box.show { display: block; }
  .result-box.success { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .result-box.error { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .result-box.warn { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .result-icon { font-size: 20px; display: block; margin-bottom: 6px; }

  /* Geo pill */
  .geo-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-family: monospace; font-size: 11px; }
  .geo-pill.checking { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border-strong); }
  .geo-pill.ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .geo-pill.fail { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

  /* History — 8-session grid */
  .history-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .hist-cell { border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; text-align: center; }
  .hist-cell.has-data { background: var(--green-bg); border-color: var(--green-border); }
  .hist-cell.today { border-color: var(--blue); background: var(--blue-bg); }
  .hc-day { font-family: monospace; font-size: 10px; color: var(--text-faint); }
  .hc-date { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
  .hc-hours { display: flex; justify-content: center; gap: 2px; margin-top: 4px; flex-wrap: wrap; }
  .hc-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--border); }
  .hc-dot.p { background: var(--green); border-color: var(--green); }

  /* Gate */
  #gate-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  .gate-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px 24px; max-width: 340px; width: 100%; text-align: center; }
  .gate-icon { font-size: 32px; margin-bottom: 12px; }
  .gate-card h2 { font-size: 17px; font-weight: normal; margin-bottom: 8px; }
  .gate-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; }

  .note { font-size: 11px; color: var(--text-faint); font-family: monospace; text-align: center; margin-top: 8px; }
</style>
</head>
<body>

<div id="gate-screen" style="display:none;">
  <div class="gate-card">
    <div class="gate-icon">🔒</div>
    <h2>Classroom access only</h2>
    <p>This check-in page can only be used inside the classroom. Please make sure you are physically present and try again.</p>
    <button class="btn btn-primary btn-full" onclick="retryGate()">Try again</button>
    <div id="gate-msg" style="font-size:12px;font-family:monospace;color:var(--text-muted);margin-top:10px;"></div>
  </div>
</div>

<header>
  <div class="header-top">
    <div class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="16" y="16" width="5" height="5" rx="0.5"/><rect x="13" y="13" width="2" height="2"/></svg></div>
    <h1>Attendance Check-In</h1>
    <span class="header-tag">Student</span>
  </div>
  <div class="course-banner" id="course-banner">
    <div class="course-title" id="course-title-el"></div>
    <div class="course-meta" id="course-meta-el"></div>
  </div>
</header>

<main>
  <div class="section-label">Your name</div>
  <div class="card" id="name-card"></div>

  <div style="text-align:center;margin-bottom:14px;">
    <span class="geo-pill checking" id="geo-pill">Checking location…</span>
  </div>

  <div class="section-label">Scan QR code</div>
  <div class="card">
    <div id="reader-container">
      <div id="reader"></div>
      <div class="scan-overlay"><div class="scan-frame"></div></div>
    </div>
    <div class="camera-status" id="camera-status">Camera not started</div>
    <div class="btn-row">
      <button class="btn btn-primary btn-full" id="start-btn" onclick="startScanner()">Start camera</button>
      <button class="btn" id="stop-btn" onclick="stopScanner()" style="display:none;">Stop</button>
    </div>
    <div class="result-box" id="scan-result"></div>
    <div class="note">Requires HTTPS or localhost.</div>
  </div>

  <div class="section-label">My attendance — all sessions</div>
  <div class="card">
    <div class="history-grid" id="history-grid"></div>
  </div>
</main>

<script>
function ld(k,d){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v));}

const DEFAULT_SESSIONS=Array.from({length:8},(_,i)=>({label:`Day ${i+1}`,date:''}));
const DEFAULT_HOURS=[
  {label:'Hour 1',time:'9:00–10:00 AM'},{label:'Hour 2',time:'10:00–11:00 AM'},
  {label:'Hour 3',time:'11:00–12:00 PM'},{label:'Hour 4',time:'12:00–1:00 PM'},
];

function getSessions(){return ld('att_sessions',DEFAULT_SESSIONS);}
function getHours(){return ld('att_hours',DEFAULT_HOURS);}

// ── Course banner ─────────────────────────────────────────────────────────────
function renderCourseBanner(){
  const c=ld('att_course_pub',{});
  if(c.title){
    document.getElementById('course-title-el').textContent=c.title;
    const meta=[c.number,c.teacher?'Instructor: '+c.teacher:''].filter(Boolean).join(' · ');
    document.getElementById('course-meta-el').textContent=meta;
    document.getElementById('course-banner').style.display='block';
    document.title=c.title+' · Attendance';
  }
}

// ── Name persistence ──────────────────────────────────────────────────────────
function getSavedName(){return localStorage.getItem('att_student_name')||'';}
function setSavedName(n){localStorage.setItem('att_student_name',n);}
function clearSavedName(){localStorage.removeItem('att_student_name');}
function getCurrentName(){
  const saved=getSavedName();if(saved)return saved;
  const input=document.getElementById('student-name');
  return input?input.value.trim():'';
}
function renderNameCard(){
  const card=document.getElementById('name-card');
  const saved=getSavedName();
  if(saved){
    card.innerHTML=`<div class="name-display"><span class="name-text">👤 ${saved}</span><button class="name-edit" onclick="editName()">Not you?</button></div>`;
  }else{
    card.innerHTML=`<input type="text" id="student-name" placeholder="Enter your full name" autocomplete="name" oninput="renderHistory()">`;
  }
  renderHistory();
}
function editName(){clearSavedName();renderNameCard();setTimeout(()=>{const i=document.getElementById('student-name');if(i)i.focus();},50);}

// ── Geo gate ──────────────────────────────────────────────────────────────────
let studentGeoResult=null;
function haversine(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function updateGeoPill(s,t){const p=document.getElementById('geo-pill');p.className='geo-pill '+s;p.textContent=t;}

function checkPageAccess(){
  const lat=parseFloat(localStorage.getItem('classroom_lat'));
  const lng=parseFloat(localStorage.getItem('classroom_lng'));
  if(isNaN(lat)||isNaN(lng)){updateGeoPill('checking','Location check on scan');return;}
  const saved=ld('att_token',null);
  if(!saved||!saved.token){updateGeoPill('checking','Waiting for QR');return;}
  let token;try{token=JSON.parse(saved.token);}catch{return;}
  if(!token.geo){updateGeoPill('ok','No geofence required');return;}
  if(!navigator.geolocation){updateGeoPill('fail','Location not supported');return;}
  updateGeoPill('checking','Getting location…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const dist=haversine(pos.coords.latitude,pos.coords.longitude,lat,lng);
    studentGeoResult={inRange:dist<=token.radius,dist};
    if(studentGeoResult.inRange){updateGeoPill('ok',`In range · ${Math.round(dist)}m`);}
    else{updateGeoPill('fail',`Out of range · ${Math.round(dist)}m`);if(dist>token.radius*3)showGate(dist,token.radius);}
  },err=>{updateGeoPill('fail','Location denied');},{enableHighAccuracy:true,timeout:10000});
}
function showGate(dist,radius){
  document.getElementById('gate-msg').textContent=`You are ${Math.round(dist)}m away (limit: ${radius}m)`;
  document.getElementById('gate-screen').style.display='flex';
}
function retryGate(){document.getElementById('gate-screen').style.display='none';studentGeoResult=null;checkPageAccess();}

// ── Scanner ───────────────────────────────────────────────────────────────────
let scanner=null,scannerActive=false,lastScanTime=0;
function startScanner(){
  const container=document.getElementById('reader-container');
  container.style.display='block';
  document.getElementById('camera-status').textContent='Starting camera…';
  document.getElementById('start-btn').style.display='none';
  document.getElementById('stop-btn').style.display='inline-block';
  if(scanner){try{scanner.clear();}catch(e){}}
  scanner=new Html5Qrcode('reader');
  scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220},aspectRatio:1.0},onScanSuccess,()=>{})
    .then(()=>{scannerActive=true;document.getElementById('camera-status').textContent="Point at teacher's QR code";})
    .catch(err=>{
      document.getElementById('camera-status').textContent='Camera error: '+(err.message||err);
      document.getElementById('start-btn').style.display='inline-block';
      document.getElementById('stop-btn').style.display='none';
      container.style.display='none';
    });
}
function stopScanner(){
  if(scanner&&scannerActive){scanner.stop().catch(()=>{});scannerActive=false;}
  document.getElementById('reader-container').style.display='none';
  document.getElementById('camera-status').textContent='Camera not started';
  document.getElementById('start-btn').style.display='inline-block';
  document.getElementById('stop-btn').style.display='none';
}
function onScanSuccess(raw){if(Date.now()-lastScanTime<3000)return;lastScanTime=Date.now();processCheckIn(raw);}

// ── Check-in ──────────────────────────────────────────────────────────────────
function showResult(type,icon,msg){const el=document.getElementById('scan-result');el.className='result-box show '+type;el.innerHTML=`<span class="result-icon">${icon}</span>${msg}`;}

function processCheckIn(raw){
  const name=getCurrentName();
  if(!name){showResult('warn','✏️','Please enter your name before scanning.');return;}
  let token;
  try{token=JSON.parse(raw);}catch{showResult('error','❌','Invalid QR code. Scan your teacher\'s code.');return;}
  if(Date.now()-token.ts>63000){showResult('error','⏰','QR code expired. Ask your teacher to refresh it.');return;}
  if(token.session===undefined||token.hour===undefined){showResult('error','❌','Unrecognised QR code.');return;}

  // Show course info from token if not already set
  if(token.courseTitle){
    sv('att_course_pub',{title:token.courseTitle,number:token.courseNumber||'',teacher:token.teacherName||''});
    renderCourseBanner();
  }

  const attendance=ld('att_records',{});
  if(attendance[name]?.[token.session]?.[token.hour]){
    showResult('warn','✅',`Already checked in for Day ${token.session+1}, Hour ${token.hour+1}.`);return;
  }

  if(token.geo&&token.lat!==null&&token.lng!==null){
    showResult('warn','📍','Verifying your location…');
    if(!navigator.geolocation){showResult('error','❌','Location not supported by your browser.');return;}
    navigator.geolocation.getCurrentPosition(pos=>{
      const dist=haversine(pos.coords.latitude,pos.coords.longitude,token.lat,token.lng);
      if(dist>token.radius){showResult('error','📍',`You are ${Math.round(dist)}m from the classroom. Must be within ${token.radius}m.`);}
      else{recordAttendance(name,token.session,token.hour,dist);}
    },err=>{showResult('error','❌','Location denied: '+err.message);},{enableHighAccuracy:true,timeout:10000});
  }else{
    recordAttendance(name,token.session,token.hour,null);
  }
}

function recordAttendance(name,si,hi,dist){
  const attendance=ld('att_records',{});
  if(!attendance[name])attendance[name]={};
  if(!attendance[name][si])attendance[name][si]={};
  if(attendance[name][si][hi]){showResult('warn','✅',`Already checked in for Day ${si+1}, Hour ${hi+1}.`);return;}
  const now=new Date();
  attendance[name][si][hi]={time:now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),date:now.toLocaleDateString(),dist:dist!==null?Math.round(dist):null};
  sv('att_records',attendance);
  // Notify teacher page (works across tabs and within same browser)
  if(typeof BroadcastChannel!=='undefined'){try{new BroadcastChannel('att_sync').postMessage('att_records');}catch(e){}}
  setSavedName(name); renderNameCard();
  const s=getSessions()[si];
  const geoNote=dist!==null?` · ${Math.round(dist)}m from classroom`:'';
  const dateNote=s.date?` (${fmtDate(s.date)})`:'';
  showResult('success','✅',`Checked in for <strong>Day ${si+1}${dateNote}, Hour ${hi+1}</strong> at ${attendance[name][si][hi].time}${geoNote}`);
  renderHistory();
}

// ── History grid ──────────────────────────────────────────────────────────────
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtDate(iso){if(!iso)return '';const[y,m,d]=iso.split('-');return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'});}

function renderHistory(){
  const name=getCurrentName();
  const grid=document.getElementById('history-grid');
  const SESSIONS=getSessions();
  const today=todayStr();

  if(!name){
    grid.innerHTML='<div style="grid-column:1/-1;font-size:12px;font-family:monospace;color:var(--text-faint);padding:8px 0;">Enter your name to see your attendance.</div>';
    return;
  }
  const attendance=ld('att_records',{});
  const rec=attendance[name]||{};

  grid.innerHTML=SESSIONS.map((s,si)=>{
    const sr=rec[si]||{};
    const hours=Object.keys(sr).length;
    const isToday=s.date&&s.date===today;
    const hasData=hours>0;
    const dots=Array.from({length:4},(_,hi)=>`<div class="hc-dot${sr[hi]?' p':''}" title="${sr[hi]?sr[hi].time:'absent'}"></div>`).join('');
    return `<div class="hist-cell${hasData?' has-data':''}${isToday?' today':''}">
      <div class="hc-day">Day ${si+1}</div>
      <div class="hc-date">${s.date?fmtDate(s.date):'—'}</div>
      <div class="hc-hours">${dots}</div>
    </div>`;
  }).join('');
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderCourseBanner();
renderNameCard();
checkPageAccess();

window.addEventListener('storage',e=>{
  if(e.key==='att_token')checkPageAccess();
  if(e.key==='att_sessions'||e.key==='att_hours')renderHistory();
  if(e.key==='att_course_pub')renderCourseBanner();
});
</script>
</body>
</html>
